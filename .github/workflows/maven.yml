name: Maven

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'NOTICE.txt'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'NOTICE.txt'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  # by default, `MAVEN_ARGS` is used in maven 3.9.0+ for all of its mvn commands
  MAVEN_ARGS: '--batch-mode --show-version --errors --no-transfer-progress'

jobs:
  test:
    name: JDK ${{matrix.java-version}} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 11, 17, 21, 25 ]
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: actions/setup-java@v6
        name: Set up JDK ${{ matrix.java-version }} - ${{ matrix.os }}
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Test
        run: mvn clean verify
